name: make-release
on:
  push:
    branches: ['upload-*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from upload/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#upload-}"
          zip=$(ls upload/*.zip | head -1)
          md5sum "$zip"; sha256sum "$zip"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$ver is already out"; else
            gh release create "v$ver" "$zip" --repo "$GITHUB_REPOSITORY" --target main --title "Tacheo $ver" --notes-file upload/notes.md --latest; fi
          gh release view "v$ver" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .size] | @tsv'
      - name: Remove the upload branch (the zip lives on the release)
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME" || true
